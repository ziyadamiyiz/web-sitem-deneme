<!-- HTML İÇERİĞİNİ GÜVENLİ GÖSTERMEK İÇİN -->

<script
    src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js">
</script>



<script>


    /*
    ===========================================
    SUPABASE BİLGİLERİ
    ===========================================
    */


    const SUPABASE_URL =
        "https://ajvbqxzxqvniompgkhum.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_FuUCGCmQogZaOaaF6pdEGg_7Yd8y1jl";



    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /*
    ===========================================
    URL'DEN SLUG AL
    ===========================================
    */


    const params =
        new URLSearchParams(
            window.location.search
        );


    const slug =
        params.get("slug");



    /*
    ===========================================
    MAKALEYİ GETİR
    ===========================================
    */


    async function makaleyiGetir() {


        const loading =
            document.getElementById(
                "loading"
            );


        const errorBox =
            document.getElementById(
                "error"
            );


        const articleBox =
            document.getElementById(
                "article"
            );



        /*
        SLUG YOKSA
        */


        if (!slug) {

            loading.style.display =
                "none";

            errorBox.style.display =
                "block";

            return;

        }



        /*
        SUPABASE'DEN YAZIYI ÇEK
        */


        const {
            data: article,
            error
        } =
            await supabaseClient

                .from("articles")

                .select(`
                    id,
                    title,
                    slug,
                    summary,
                    content,
                    created_at
                `)

                .eq(
                    "slug",
                    slug
                )

                .eq(
                    "published",
                    true
                )

                .single();



        /*
        YAZI BULUNAMADIYSA
        */


        if (
            error ||
            !article
        ) {


            console.error(
                "Supabase hatası:",
                error
            );


            loading.style.display =
                "none";


            errorBox.style.display =
                "block";


            return;

        }



        /*
        ===========================================
        BAŞLIK
        ===========================================
        */


        document
            .getElementById(
                "article-title"
            )
            .textContent =
                article.title;



        /*
        TARAYICI BAŞLIĞINI DA DEĞİŞTİR
        */


        document.title =
            article.title +
            " | KÂRİ";



        /*
        ===========================================
        ÖZET
        ===========================================
        */


        const summary =
            document.getElementById(
                "article-summary"
            );


        if (article.summary) {

            summary.textContent =
                article.summary;

        }

        else {

            summary.style.display =
                "none";

        }



        /*
        ===========================================
        TARİH
        ===========================================
        */


        const date =
            new Date(
                article.created_at
            );


        const formattedDate =
            date.toLocaleDateString(
                "tr-TR",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );



        document
            .getElementById(
                "article-meta"
            )
            .textContent =
                "Yazar Adı · " +
                formattedDate;



        /*
        ===========================================
        MAKALE İÇERİĞİ
        ===========================================
        */


        const articleContent =
            document.getElementById(
                "article-content"
            );


        articleContent.innerHTML =
            DOMPurify.sanitize(
                article.content || ""
            );



        /*
        ===========================================
        SAYFAYI GÖSTER
        ===========================================
        */


        loading.style.display =
            "none";


        articleBox.style.display =
            "block";


    }



    /*
    SAYFA AÇILDIĞINDA ÇALIŞTIR
    */


    makaleyiGetir();


</script>
